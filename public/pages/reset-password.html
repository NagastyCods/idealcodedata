<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - IdealDataHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="reset-container">
    <div id="resetForm">
      <div class="reset-header">
        <h1>Reset Your Password</h1>
        <p>Enter a new password to regain access to your account</p>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <form id="passwordResetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input 
            type="password" 
            id="newPassword" 
            placeholder="Enter new password" 
            required
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Confirm new password" 
            required
            autocomplete="new-password"
          >
          <div id="passwordStrength" class="password-strength"></div>
        </div>

        <button type="submit" class="btn-reset" id="submitBtn">
          Reset Password
        </button>
      </form>

      <div class="back-to-login">
        <a href="/auth">Back to Login</a>
      </div>
    </div>

    <div id="invalidLink" class="invalid-link" style="display: none;">
      <div class="invalid-link-icon">⚠️</div>
      <h2>Invalid or Expired Link</h2>
      <p>This password reset link is invalid or has expired.</p>
      <p>Password reset links are valid for 1 hour.</p>
      <a href="/auth?tab=forgot">Request a New Reset Link</a>
    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
